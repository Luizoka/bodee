services:
  postgres:
    image: postgres:16-alpine
    container_name: fatura-sync-postgres
    environment:
      POSTGRES_DB: fatura_sync
      POSTGRES_USER: fatura_sync
      POSTGRES_PASSWORD: fatura_sync
    ports:
      - '5432:5432'
    volumes:
      - fatura-sync-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fatura_sync -d fatura_sync']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  fatura-sync-postgres:
