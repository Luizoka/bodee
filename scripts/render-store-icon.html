<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body, canvas { display: block; width: 100%; height: 100%; margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <canvas id="icon" width="128" height="128"></canvas>
    <script>
      const image = new Image();
      image.src = '../store-assets/icon/bode-icon-source.png';
      image.addEventListener('load', () => {
        document.querySelector('#icon').getContext('2d').drawImage(image, 10, 10, 108, 108);
      });
    </script>
  </body>
</html>
