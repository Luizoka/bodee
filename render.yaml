services:
  - type: web
    name: fatura-sync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: PLAYWRIGHT_HEADLESS
        value: 'true'
      - key: PLAYWRIGHT_BROWSER_CHANNEL
        value: chromium
      - key: PLAYWRIGHT_TIMEOUT_MS
        value: '60000'
      - key: EQUATORIAL_API_TIMEOUT_MS
        value: '30000'
