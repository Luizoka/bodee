<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BODE</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>🐐 BODE</h1>
      <p id="session-status" class="status">Verificando sessão…</p>
      <button id="load-accounts" type="button">ATUALIZAR UNIDADES</button>
      <section id="invoices-section" hidden>
        <div class="section-heading">
          <label>Unidades</label>
          <button id="select-all-accounts" type="button" class="text-button">Todas</button>
        </div>
        <div id="accounts" class="choices"></div>
        <div class="section-heading">
          <label>Competências</label>
          <button id="select-all-invoices" type="button" class="text-button">Todas</button>
        </div>
        <div id="invoices" class="invoices"></div>
        <button id="download" type="button" disabled>BAIXAR FATURAS</button>
      </section>
      <p id="message" class="message" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
