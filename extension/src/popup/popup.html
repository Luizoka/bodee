<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BODEE</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <h1 class="visually-hidden">BODEE</h1>
        <img class="brand-logo" src="../../assets/bode-logo.png" alt="BODEE" />
        <p>Suas faturas, bééém fáceis.</p>
      </header>
      <div class="popup-content">
        <div class="session-row">
          <p id="session-status" class="status">Verificando sessão…</p>
          <button id="load-accounts" class="reload-button" type="button" title="Atualizar unidades" aria-label="Atualizar unidades" disabled><span aria-hidden="true">↻</span></button>
        </div>
        <button id="open-portal" type="button" hidden>ABRIR PORTAL DA EQUATORIAL</button>
        <section id="invoices-section" hidden>
          <div class="selection-section">
            <div class="section-heading">
              <label><svg class="label-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21h.01M15 11h.01" /></svg><span>Unidades</span><span id="selected-accounts-count" class="selected-count"></span></label>
              <span class="section-actions"><button id="select-all-accounts" type="button" class="text-button">Todas</button><button id="accounts-toggle" class="section-toggle" type="button" aria-controls="accounts-content" aria-expanded="true" aria-label="Minimizar unidades" title="Minimizar unidades"></button></span>
            </div>
            <div id="accounts-content" class="selection-content">
              <input id="account-search" class="account-search" type="search" placeholder="Pesquisar por UC, conta ou titular" aria-label="Pesquisar unidades consumidoras" autocomplete="off" />
              <div id="accounts" class="choices"></div>
            </div>
          </div>
          <div class="selection-section">
            <div class="section-heading">
              <label><svg class="label-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" /></svg><span>Competências</span><span id="selected-invoices-count" class="selected-count"></span></label>
              <span class="section-actions">
                <label class="open-invoices-filter" for="open-invoices-only" title="Somente em aberto">
                  <input id="open-invoices-only" type="checkbox" role="switch" aria-label="Somente em aberto" />
                  <svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.5 7.2V18l-3 1.5v-7.3z" /></svg>
                </label>
                <button id="select-all-invoices" type="button" class="text-button">Todas</button>
                <button id="invoices-toggle" class="section-toggle" type="button" aria-controls="invoices-content" aria-expanded="true" aria-label="Minimizar competências" title="Minimizar competências"></button>
              </span>
            </div>
            <div id="invoices-content" class="selection-content">
              <div id="invoices" class="invoices"></div>
            </div>
          </div>
          <button id="download" type="button" disabled><span aria-hidden="true">↓</span> BAIXAR FATURAS</button>
        </section>
        <section id="download-progress" class="download-progress" aria-live="polite" hidden>
          <span id="download-complete-icon" class="download-complete-icon" aria-hidden="true">✓</span>
          <div class="download-progress-heading">
            <strong id="download-progress-label">Baixando faturas</strong>
            <span class="download-progress-actions"><span id="download-progress-count">0/0</span><button id="download-queue-toggle" class="queue-toggle" type="button" aria-expanded="true" aria-label="Minimizar fila" title="Minimizar fila"></button></span>
          </div>
          <progress id="download-progress-bar" value="0" max="1"></progress>
          <ul id="download-queue-items" class="download-queue-items" aria-label="Situação das faturas"></ul>
        </section>
        <div id="download-queue-note" class="download-queue-note" hidden>
          <span>A fila continua se você fechar o popup.</span>
          <button id="download-queue-cancel" class="text-button queue-cancel" type="button">Cancelar</button>
        </div>
        <p id="message" class="message" role="status"></p>
        <img class="mascot" src="../../assets/bode-mascot.png" alt="" />
      </div>
    </main>
    <!-- MOCK_CONFIG -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
