<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BODE</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <h1 class="visually-hidden">BODE</h1>
        <img class="brand-logo" src="../../assets/bode-logo.png" alt="BODE" />
        <p>Suas faturas, bééém fáceis.</p>
      </header>
      <div class="session-row">
        <p id="session-status" class="status">Verificando sessão…</p>
        <button id="load-accounts" class="reload-button" type="button" title="Atualizar unidades" aria-label="Atualizar unidades" disabled><span aria-hidden="true">↻</span></button>
      </div>
      <button id="open-portal" type="button" hidden>ABRIR PORTAL DA EQUATORIAL</button>
      <section id="invoices-section" hidden>
        <div class="section-heading">
          <label><svg class="label-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6M9 11h.01M15 11h.01" /></svg>Unidades</label>
          <button id="select-all-accounts" type="button" class="text-button">Todas</button>
        </div>
        <div id="accounts" class="choices"></div>
        <div class="section-heading">
          <label><svg class="label-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" /></svg>Competências</label>
          <button id="select-all-invoices" type="button" class="text-button">Todas</button>
        </div>
        <div id="invoices" class="invoices"></div>
        <button id="download" type="button" disabled><span aria-hidden="true">↓</span> BAIXAR FATURAS</button>
      </section>
      <section id="download-progress" class="download-progress" aria-live="polite" hidden>
        <div><strong id="download-progress-label">Baixando faturas</strong><span id="download-progress-count">0/0</span></div>
        <progress id="download-progress-bar" value="0" max="1"></progress>
      </section>
      <p id="message" class="message" role="status"></p>
      <img class="mascot" src="../../assets/bode-mascot.png" alt="" />
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
